[package]
name = "flare-plugin-kit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shared server skeleton of Flare business plugins: runtime wiring, PostgreSQL, migrations, idempotent commands, outbox, membership checks and entity state publishing"

[features]
# Unverified callers for tests of the plugins built on this kit. Never enable
# it in a release build.
testing = []

[dependencies]
tracing = "0.1"
flare-plugin-host = { path = "../flare-plugin-host" }
flare-grpc-proto = { path = "../../flare-protocol-grpc" }
flare-server-core = { path = "../../flare-server-runtime", features = ["nats"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tonic = "0.14"
prost-types = "0.14"
thiserror = "2"
